<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Una disculpa especial</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #932b48;
            background-image: url('IMG/Inicio Fondo.png'); 
            background-size: contain; 
            background-position: center;
            background-repeat: no-repeat;
            height: 100vh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            transition: background-image 0.5s ease;
        }

        /* Contenedor principal de la tarjeta */
        .content-box {
            position: relative;
            width: 34vw; 
            max-width: 420px;
            height: 75vh; 
            max-height: 650px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 20px 15px;
        }

        /* Zona del texto empujada hacia abajo para tocar la línea azul */
        .text-container {
            width: 100%;
            text-align: center;
            margin-top: 25vh; 
            padding: 0 10px;
        }

        h1 {
            color: #333333; 
            font-size: clamp(15px, 2.2vw, 22px); /* Escala perfectamente entre PC y móvil */
            line-height: 1.3;
            text-shadow: none; 
        }

        /* Zona de botones en la línea amarilla */
        .buttons {
            display: flex;
            justify-content: center;
            gap: 20px;
            align-items: center;
            width: 100%;
            margin-bottom: 5px; 
        }

        .custom-btn {
            background: none;
            border: none;
            cursor: pointer;
            transition: transform 0.2s ease;
            padding: 0;
        }

        .custom-btn img {
            display: block;
            width: clamp(85px, 9vw, 110px); /* Los botones también escalan suavemente en pantallas chicas */
            height: auto;
            pointer-events: none;
        }

        #yes-btn {
            transform-origin: center;
        }

        #yes-btn:hover {
            transform: scale(1.08);
        }

        .success-message {
            color: #333333;
            font-size: 22px;
            font-weight: bold;
        }

        /* --- REGLA ESPECIAL PARA TELÉFONOS MÓVILES --- */
        @media screen and (max-width: 768px) {
            .content-box {
                width: 88vw; /* En celulares ocupa un ancho seguro y proporcionado */
                height: 72vh;
            }
            .text-container {
                margin-top: 23vh; /* Mantiene la proporción exacta de altura */
            }
        }
    </style>
</head>
<body>

    <!-- Contenedor ajustado al diseño de tu tarjeta -->
    <div class="content-box">
        <div class="text-container">
            <h1 id="question">Preciosa, sé que estuve mal, por favor perdóname ¿Si?</h1>
        </div>
        
        <div class="buttons" id="button-container">
            <button id="yes-btn" class="custom-btn" onclick="sayYes()">
                <img src="IMG/Inicio Boton Si.png" alt="Sí, te perdono">
            </button>
            
            <button id="no-btn" class="custom-btn" onclick="sayNo()">
                <img src="IMG/Inicio Boton No.png" alt="No">
            </button>
        </div>
    </div>

    <script>
        const noPhrases = [
            "En serio lo siento, no fue mi intención, por favor perdóname",      
            "No quise hacerte sentir mal amor, yo te amo, solo dame otra oportunidad",      
            "Te lo compensaré amor, por favor perdóname 😭",   
            "AMOR BASTA, me estoy achicopalando perdónameeeee :(" 
        ];

        const backgroundImages = [
            'IMG/Inicio Fondo.png', 
            'IMG/Foto 2.png',       
            'IMG/Foto 3.png',       
            'IMG/Foto 4.png',       
            'IMG/Foto 5.png'        
        ];

        let clickCount = 0;
        let yesButtonScale = 1;

        function sayNo() {
            const questionEl = document.getElementById("question");
            const yesBtn = document.getElementById("yes-btn");
            const noBtn = document.getElementById("no-btn");

            clickCount++; 

            if (clickCount === 1) {
                questionEl.innerText = noPhrases[0];
                document.body.style.backgroundImage = `url('${backgroundImages[1]}')`;
            } 
            else if (clickCount === 2) {
                questionEl.innerText = noPhrases[1];
                document.body.style.backgroundImage = `url('${backgroundImages[2]}')`;
            } 
            else if (clickCount === 3) {
                questionEl.innerText = noPhrases[2];
                document.body.style.backgroundImage = `url('${backgroundImages[3]}')`;
            } 
            else if (clickCount >= 4) {
                questionEl.innerText = noPhrases[3];
                document.body.style.backgroundImage = `url('${backgroundImages[4]}')`;
                
                if (noBtn) {
                    noBtn.style.display = "none";
                }
            }

            yesButtonScale += 0.15;
            if (yesBtn) {
                yesBtn.style.transform = `scale(${yesButtonScale})`;
            }
        }

        function sayYes() {
            document.body.style.backgroundImage = `url('IMG/Final Fondo.png')`; 
            
            const contentBox = document.querySelector(".content-box");
            if (contentBox) {
                contentBox.innerHTML = `
                    <div style="text-align: center; margin: auto;">
                        <h1 class="success-message">Lo sabía, es que tu me amas mucho mucho mucho así como yo a ti, una galaxia entera mi vida</h1>
                    </div>
                `;
            }

            // Aquí se conecta directamente con tu enlace de Formspree
            fetch('https://formspree.io/f/xaewgjkz', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ message: "Cris Te perdonó ❤️" })
            }).catch(error => console.log('Aviso enviado localmente'));
        }
    </script>
</body>
</html>
